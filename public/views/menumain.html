<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/img/icon/menunet_icon.png" type="image/x-icon" />

    <link rel="stylesheet" href="/vendor/animate.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/vendor/fontawesome-free-7.2.0-web/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/menumain.css" />
    <title>MenuNet | Cardápio Digital</title>
  </head>
  <body>
    <header class="animate__animated animate__fadeInDown">
      <div id="logo">
        <img src="/img/menunet_logo.png" alt="logo da menunet" />
      </div>
    </header>

    <main>
      <section id="filterer">
        <div id="filtros" class="animate__animated animate__fadeIn">
          <select name="tipo" id="filtroTipo">
            <option disabled selected value="">Filtrar por tipo</option>
            <option value="comidos">Comidas</option>
            <option value="bebidos">Bebidas</option>
          </select>
          <select name="preco" id="filtroPreco">
            <option disabled selected value="">Filtrar por preço</option>
            <option value="ate-5000">Até 5.000kz</option>
            <option value="5000-10000">5.000kz - 10.000kz</option>
            <option value="acima-10000">Acima de 10.000kz</option>
          </select>
        </div>
      </section>

      <div id="grouper">
        <!---
        <div
          class="card-item animate__animated animate__zoomIn"
          style="animation-delay: 0.2s"
        >
          <img src="../img/tipico4.jpg" alt="Calulú" />
          <div class="card-info">
            <h3>Ginguinga</h3>
            <p class="price">3.500kz</p>
          </div>
        </div>-->
      </div>
    </main>

    <footer class="animate__animated animate__fadeInUp">
      <p id="cpright"></p>
      <div class="social-links">
        <a target="_blank" href="https://instagram.com/loth_franqueira"
          ><i class="fab fa-instagram"></i>Instagram</a
        >
        <a target="_blank" href="#"><i class="fab fa-linkedin"></i>LinkedIn</a>
        <a target="_blank" href="https://facebook.com/profile/Lopo Franqueira"
          ><i class="fab fa-facebook"></i>Facebook</a
        >
        <a target="_blank" href="https://github.com/L-Franq"
          ><i class="fab fa-github"></i>GitHub</a
        >
      </div>
    </footer>

    <script src="/js/menumain.js"></script>
  </body>
</html>
