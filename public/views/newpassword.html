<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../img/icon/icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="../vendor/animate.css" />
    <link
      rel="stylesheet"
      href="../vendor/fontawesome-free-7.2.0-web/css/all.min.css"
    />
    <link rel="stylesheet" href="../login.css" />
    <link rel="stylesheet" href="../vendor/sweet.css" />
    <title>Recuperar Senha</title>
  </head>
  <body>
    <div class="register-container animate__animated animate__fadeInUp">
      <form id="formRecovery" action="">
        <h1>Nova Password</h1>
        <input id="senha" required placeholder="Nova senha" type="password" />
        <input id="confirmSenha" required placeholder="Confirme a senha" type="password" />
        <p
          class="hidden"
          id="erro"
          style="
            color: tomato;
            font-size: 14px;
            margin: 5px;
            text-align: center;
          "
        ></p>
        <button id="recuperar" type="submit">RECUPERAR</button>
      </form>
    </div>

    <script src="../vendor/sweet.js"></script>
    <script src="../passwordRecovery.js"></script>
  </body>
</html>
