<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/historico.css" />
    <link rel="stylesheet" href="/vendor/animate.css" />
    <link
      rel="stylesheet"
      href="/vendor/fontawesome-free-7.2.0-web/css/all.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="/img/icon/menunet_icon.png"
      type="image/x-icon"
    />
    <title>MenuNet | gerir-pratos</title>
    <style>
      #card-container {
        :root {
          --bg: #f4f9f9;
          --tx: #035373;
          --ef: #04bfbf;
          --white: #ffffff;
        }

        form {
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          background-color: var(--bg);
          width: 100%;
          height: 80%;
          padding: 25px;
          border: 1px solid #888;
          border-radius: 5px;
          box-shadow: 0 4px 15px rgba(3, 83, 115, 0.3);
        }

        #preview {
          color: var(--tx);
          font-weight: 700;
          font-size: 15px;
          margin: 4px;
        }

        #newpreview {
          width: 196px;
          height: 85px;
          margin: 8px;
          border: 2px dashed #888;
          border-radius: 5px;
        }

        #newpreview img {
          width: 100%;
          height: 98%;
          border-radius: 8px;
        }

        .input-adt {
          width: 74%;
          padding: 2px;
          margin: 4px;
        }

        label {
          font-size: 14px;
          font-weight: 600;
          color: var(--tx);
        }

        input,
        select {
          border: 2px double var(--ef);
          border-radius: 8px;
          padding: 10px;
          outline: none;
          width: 100%;
          font-size: 15px;
        }

        button {
          width: 240px;
          height: 44px;
          margin-top: 15px;
          padding: 15px;
          border: none;
          border-radius: 12px;
          background-color: var(--tx);
          color: white;
          font-weight: 600;
          font-size: 1rem;
          letter-spacing: 1px;
          cursor: pointer;
          transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
          box-shadow: 0 4px 15px rgba(3, 83, 115, 0.3);
        }

        button:hover {
          background-color: var(--ef);
          transform: translateY(-3px);
          box-shadow: 0 8px 20px rgba(4, 191, 191, 0.4);
        }

        button:active {
          transform: translateY(0);
        }

        #card-container {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 8px;
          width: 600px;
          height: 580px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header-dash animate__animated animate__fadeIn">
        <div>
          <h1>Gerir Pratos</h1>
          <p>Pratos já publicados. Pode editar ou eliminar do menu.</p>
        </div>
        <span id="voltar" class="voltar-btn">Voltar</span>
      </header>

      <div
        id="historyContainer"
        class="history-grid animate__animated animate__fadeInUp"
      >
        <div class="history-card">
          <img src="/img/deadfish.jpg" alt="sem pratos a apresentar" />
          <div class="history-info">
            <h4>Sem Menu</h4>
            <p>Última vez: Hoje</p>
            <span class="status-tag">Publicado</span>
          </div>
          <div class="history-actions">
            <button class="btn-action btn-edit">
              EDITAR&nbsp;<i class="fa-solid fa-pen"></i>
            </button>
            <button class="btn-action btn-delete">
              ELIMINAR&nbsp;<i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <div class="modal-overlay hidden" id="modal-editar">
      <div id="card-container">
        <form id="form-atualizar" action="">
          <div id="preview">Preview de Imagem</div>
          <div id="newpreview">
            <img
              class="pageInputs"
              id="img-preview"
              src=""
              alt="imagem previsualizada para edição."
            />
          </div>
          <div class="input-adt">
            <input type="file" accept="image/*" id="dishImg" />
          </div>
          <div class="input-adt">
            <label for="nome">Nome do Prato</label>
            <input
              required
              type="text"
              id="dishName"
              placeholder="arroz de exemplo..."
              name="nome"
              class="pageInputs"
            />
          </div>
          <div class="input-adt">
            <label for="preco">Preço</label>
            <input
              required
              name="preco"
              type="text"
              id="dishPrice"
              placeholder="Ex: 5000.00 (para cêntavos use ponto(0.00) não vírgula(0,00))"
              class="pageInputs"
            />
          </div>
          <div class="input-adt">
            <label for="descricao">Descrição</label>
            <input
              required
              name="descricao"
              type="text"
              id="dishDesc"
              placeholder="detalhes de ingredientes"
              class="pageInputs"
            />
          </div>
          <div class="input-adt">
            <label for="categoria">Categoria</label>
            <select class="pageInputs" required name="categoria" id="dishCateg">
              <option selected disabled value="">
                Selecione uma categoria
              </option>
              <option value="comida">Comida</option>
              <option value="bebida">Bebida</option>
            </select>
          </div>

          <button type="submit">CONFIRMAR</button>
        </form>
      </div>
    </div>

    <script src="/vendor/sweet.js"></script>
    <script src="/js/gerirpratos.js"></script>
  </body>
</html>
